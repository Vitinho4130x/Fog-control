name: Check mod against Horizon

on:
  push:
  workflow_dispatch:

env:
  # Commit do horizon-rust/horizon que ja contem native_render_fog (merge do PR #6003).
  HORIZON_REV: 653af80c4a544fc0a9916daad0c366e40087766f
  # horizon-mixins 0.5.0, a revisao que o template oficial usa.
  MIXINS_REV: 0500ff2
  # Rust que o launcher do Horizon usa para compilar o jogo.
  HORIZON_RUST: 1.99.1

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Pacotes do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxkbcommon-dev \
            libwayland-dev libudev-dev libasound2-dev

      - name: Clonar o Horizon no commit fixado
        shell: bash
        run: |
          git clone --filter=blob:none https://github.com/horizon-rust/horizon.git horizon-git
          git -C horizon-git checkout "$HORIZON_REV"
          mkdir horizon-src
          git -C horizon-git archive "$HORIZON_REV" | tar -x -C horizon-src
          echo "Horizon em $(git -C horizon-git rev-parse HEAD)"

          # horizon-mixins recusa links simbolicos (ex.: CLAUDE.md). Troca cada um
          # pela copia do arquivo de destino; links quebrados ou para pastas sao removidos.
          find horizon-src -type l | while read -r link; do
            echo "symlink: $link -> $(readlink "$link")"
            if [ -f "$link" ]; then
              tmp=$(mktemp)
              cp -L "$link" "$tmp"
              rm "$link"
              mv "$tmp" "$link"
              chmod 644 "$link"
            else
              rm "$link"
            fi
          done
          echo "symlinks restantes: $(find horizon-src -type l | wc -l)"

      - name: Compilar o horizon-mixins
        shell: bash
        run: |
          git clone https://github.com/horizon-rust/horizon-mixins.git
          git -C horizon-mixins checkout "$MIXINS_REV"
          cd horizon-mixins
          cargo build --locked --release -p horizon-mixins-cli

      - name: Planejar e aplicar o mod
        shell: bash
        run: |
          MIX=./horizon-mixins/target/release/horizon-mixins
          $MIX plan  --workspace horizon-src --mods mixins --out plan.json
          $MIX apply --workspace horizon-src --mods mixins --out modded

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plan
          path: plan.json
          if-no-files-found: ignore

      - name: Rust do Horizon
        run: rustup toolchain install "$HORIZON_RUST" --profile minimal

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: modded
          cache-on-failure: true

      - name: cargo check do jogo modificado
        shell: bash
        working-directory: modded
        run: |
          cargo +"$HORIZON_RUST" check --locked -p horizon-client \
            --no-default-features --features mods 2>&1 | tee ../check.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: check-log
          path: check.log
          if-no-files-found: ignore
